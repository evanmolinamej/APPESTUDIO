<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["dormido","lentes","relajado","celebra"],"default":"lentes"},"size":{"editor":"int","default":200,"min":32,"max":400},"$preview":{"width":200,"height":228}}'>
class Component extends DCLogic {
renderVals() {
const mood = this.props.mood ?? 'lentes';
const size = Number(this.props.size ?? 200);
return { w: size, h: Math.round(size * 1.14), dormido: mood === 'dormido', lentes: mood === 'lentes', relajado: mood === 'relajado', celebra: mood === 'celebra' };
}
}
