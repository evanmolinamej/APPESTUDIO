<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fin de bloque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--menta:#E4F5EA;--crema:#F6F8F1;--cactus:#4FAE74;--bosque:#1E5B3C;--arena:#F7EFD8;--rosa:#F28FA8;--arena-borde:#E6D6A8;--menta-media:#CBE9D5;--rosa-claro:#FCE3EA;--suave:#4B6B59;--campo:#FFFFFC;--borde-campo:#5E8D72;--sombra-sm:0 2px 8px rgba(30,91,60,.10);--sombra-md:0 8px 22px rgba(30,91,60,.12);--sombra-lg:0 18px 44px rgba(30,91,60,.20)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;font-size:16px;color:var(--bosque);background:var(--menta)}
h1,h2,h3,p,ul{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border:2px solid var(--bosque);border-radius:999px;font-size:17px;font-weight:800;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--bosque);color:var(--crema)}
.btn-s{background:var(--crema);color:var(--bosque)}
.btn-g{background:transparent;border-color:transparent;color:var(--bosque);padding:0 14px;text-decoration:underline;text-underline-offset:4px}
.btn-sm{height:44px;padding:0 18px;font-size:15px}
.btn:focus-visible{outline:3px solid var(--bosque);outline-offset:3px}
.zona{background:var(--crema);border-radius:32px;box-shadow:var(--sombra-md)}
.lbl{font-size:14px;font-weight:800;color:var(--suave)}
.stat{flex:1;display:flex;align-items:baseline;justify-content:center;gap:10px;padding:12px 16px;background:var(--arena);border:2px solid var(--arena-borde);border-radius:20px}
.stat b{font-size:32px;font-weight:900;line-height:1}
.stat span{font-size:15px;font-weight:700;color:var(--suave)}
</style>
</helmet>
<div style="width:700px;height:780px;padding:0 24px 24px;background:var(--menta);overflow:hidden">

<div style="height:64px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px">
<dc-import name="Cactus" mood="celebra" size="34" hint-size="34px,39px"></dc-import>
<span style="font-size:20px;font-weight:900">EffectiveStudy</span>
</div>
<span class="lbl" style="padding:6px 14px;background:var(--crema);border-radius:999px">Pomodoro 25/5</span>
</div>

<section class="zona" style="padding:24px 32px 30px;display:flex;flex-direction:column;align-items:center;text-align:center" aria-label="Bloque terminado">
<dc-import name="Cactus" mood="celebra" size="240" hint-size="240px,274px"></dc-import>
<h1 style="margin-top:4px;font-size:38px;font-weight:900">¡Bloque terminado!</h1>
<p style="margin-top:6px;font-size:19px;font-weight:700">Estudiaste 25 minutos seguidos. Te ganaste 5 de descanso.</p>
<span class="lbl" style="margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:2px dashed var(--borde-campo);border-radius:999px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4M2.500 9a9.500 9.500 0 0 1 2-4.500M21.500 9a9.500 9.500 0 0 0-2-4.500"/></svg>Suena una campana suave</span>
<div style="margin-top:16px;width:100%;display:flex;gap:12px">
<div class="stat"><b>6</b><span>tarjetas creadas</span></div>
<div class="stat"><b>5</b><span>ideas clave</span></div>
</div>
<div style="margin-top:20px;display:flex;gap:12px">
<a class="btn btn-p" href="06-descanso.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Empezar descanso de 5 min</a>
<a class="btn btn-s" href="02-sesion.dc.html">Otro bloque</a>
</div>
<button class="btn btn-g btn-sm" type="button" style="margin-top:12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Descargar mis tarjetas</button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":700,"height":780}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
