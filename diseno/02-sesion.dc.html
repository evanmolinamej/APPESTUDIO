<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sesión de estudio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--menta:#E4F5EA;--crema:#F6F8F1;--cactus:#4FAE74;--bosque:#1E5B3C;--arena:#F7EFD8;--rosa:#F28FA8;--arena-borde:#E6D6A8;--menta-media:#CBE9D5;--rosa-claro:#FCE3EA;--suave:#4B6B59;--campo:#FFFFFC;--borde-campo:#5E8D72;--sombra-sm:0 2px 8px rgba(30,91,60,.10);--sombra-md:0 8px 22px rgba(30,91,60,.12);--sombra-lg:0 18px 44px rgba(30,91,60,.20)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;font-size:16px;color:var(--bosque);background:var(--menta)}
h1,h2,h3,p,ul{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border:2px solid var(--bosque);border-radius:999px;font-size:17px;font-weight:800;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--bosque);color:var(--crema)}
.btn-s{background:var(--crema);color:var(--bosque)}
.btn-g{background:transparent;border-color:transparent;color:var(--bosque);padding:0 14px;text-decoration:underline;text-underline-offset:4px}
.btn-sm{height:44px;padding:0 18px;font-size:15px}
.btn:disabled{background:var(--menta-media);border-color:var(--menta-media);color:var(--suave);cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.campo:focus-visible{outline:3px solid var(--bosque);outline-offset:3px}
.zona{background:var(--crema);border-radius:32px;box-shadow:var(--sombra-md)}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--arena-borde);background:var(--arena);font-size:15px;font-weight:800;cursor:pointer;color:var(--bosque)}
.chip.nuevo{background:transparent;border:2px dashed var(--borde-campo)}
.tabs{display:flex;gap:4px;padding:5px;background:var(--menta);border-radius:999px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:999px;font-size:16px;font-weight:800;text-decoration:none;color:var(--bosque)}
.tab.on{background:var(--bosque);color:var(--crema)}
.campo{width:100%;border:2px solid var(--borde-campo);border-radius:16px;background:var(--campo);padding:12px 14px;font-size:16px;font-weight:600}
.campo::placeholder{color:var(--suave);opacity:1}
.lbl{font-size:14px;font-weight:800;color:var(--suave)}
</style>
</helmet>
<div style="width:700px;height:940px;padding:0 24px 24px;background:var(--menta);overflow:hidden">

<div style="height:64px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px">
<dc-import name="Cactus" mood="lentes" size="34" hint-size="34px,39px"></dc-import>
<span style="font-size:20px;font-weight:900">EffectiveStudy</span>
</div>
<span class="lbl" style="padding:6px 14px;background:var(--crema);border-radius:999px">Pomodoro 25/5</span>
</div>

<section class="zona" style="padding:20px 24px 22px" aria-label="Cronómetro">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800"><span style="width:10px;height:10px;border-radius:50%;background:var(--cactus)"></span>Estudiando</span>
<span class="lbl">Bloque 1</span>
</div>
<div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:20px">
<dc-import name="Cactus" mood="lentes" size="124" hint-size="124px,141px"></dc-import>
<div class="mono" role="timer" aria-label="14 minutos 52 segundos" style="font-size:116px;font-weight:800;line-height:1;letter-spacing:-.02em">14:52</div>
</div>
<div style="margin-top:14px;height:12px;border-radius:6px;background:var(--menta-media);overflow:hidden"><div style="width:40%;height:100%;border-radius:6px;background:var(--cactus)"></div></div>
<div style="margin-top:16px;display:flex;align-items:center;gap:12px">
<button class="btn btn-p" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>Pausar</button>
<button class="btn btn-s" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4.5h4.5"/></svg>Reiniciar</button>
<span style="flex:1"></span>
<a class="btn btn-g btn-sm" href="Main.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Cambiar tiempo</a>
</div>
</section>

<section class="zona" style="margin-top:16px;padding:16px 20px 20px" aria-label="Panel de estudio">
<nav class="tabs" aria-label="Pestañas del panel">
<a class="tab on" href="02-sesion.dc.html" aria-current="page">Flashcards</a>
<a class="tab" href="04-ideas.dc.html">Ideas clave</a>
<a class="tab" href="05-repaso.dc.html">Repaso</a>
</nav>

<div style="margin-top:16px;display:flex;flex-direction:column;gap:6px">
<label for="materia" class="lbl">Empieza con una materia</label>
<div style="display:flex;gap:10px">
<input id="materia" class="campo" type="text" placeholder="Nombre de la materia, ej. Microeconomía" style="height:52px">
<button class="btn btn-p btn-sm" type="button" style="height:52px;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Crear materia</button>
</div>
</div>

<div style="margin-top:14px;padding:22px 20px;border:2px dashed var(--arena-borde);border-radius:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px">
<svg width="132" height="104" viewBox="0 0 132 104" fill="none" aria-hidden="true">
<rect x="20" y="26" width="84" height="60" rx="14" transform="rotate(-8 62 56)" fill="#E6D6A8" stroke="#1E5B3C" stroke-width="4"/>
<rect x="30" y="18" width="84" height="60" rx="14" fill="#F7EFD8" stroke="#1E5B3C" stroke-width="4"/>
<path d="M46 40H98M46 54H76" stroke="#1E5B3C" stroke-width="4" stroke-linecap="round"/>
<circle cx="108" cy="22" r="8" fill="#F28FA8" stroke="#1E5B3C" stroke-width="3.5"/>
<path d="M108 30V44" stroke="#1E5B3C" stroke-width="3.5" stroke-linecap="round"/>
</svg>
<h3 style="font-size:20px;font-weight:900">Aún no tienes tarjetas</h3>
<p style="max-width:380px;font-size:16px;font-weight:600;color:var(--suave)">Crea una materia y anota una pregunta con su respuesta mientras estudias. Aparecerán aquí.</p>
</div>

<div style="margin-top:16px;display:flex;align-items:center;gap:14px">
<button class="btn btn-s btn-sm" type="button" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Descargar mis tarjetas</button>
<span style="font-size:14px;font-weight:600;color:var(--suave)">Las tarjetas no se guardan al cerrar la pestaña.</span>
</div>
</section>

</div>
</x-dc>

</body>
</html>
