<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Descanso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--menta:#E4F5EA;--crema:#F6F8F1;--cactus:#4FAE74;--bosque:#1E5B3C;--arena:#F7EFD8;--rosa:#F28FA8;--arena-borde:#E6D6A8;--menta-media:#CBE9D5;--rosa-claro:#FCE3EA;--suave:#4B6B59;--campo:#FFFFFC;--borde-campo:#5E8D72;--sombra-sm:0 2px 8px rgba(30,91,60,.10);--sombra-md:0 8px 22px rgba(30,91,60,.12);--sombra-lg:0 18px 44px rgba(30,91,60,.20)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;font-size:16px;color:var(--bosque);background:var(--menta)}
h1,h2,h3,p,ul{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border:2px solid var(--bosque);border-radius:999px;font-size:17px;font-weight:800;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--bosque);color:var(--crema)}
.btn-s{background:var(--crema);color:var(--bosque)}
.btn-g{background:transparent;border-color:transparent;color:var(--bosque);padding:0 14px;text-decoration:underline;text-underline-offset:4px}
.btn-sm{height:44px;padding:0 18px;font-size:15px}
.btn:focus-visible{outline:3px solid var(--bosque);outline-offset:3px}
.zona{background:var(--crema);border-radius:32px;box-shadow:var(--sombra-md)}
.lbl{font-size:14px;font-weight:800;color:var(--suave)}
.tip{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;background:var(--arena);border:2px solid var(--arena-borde);border-radius:22px;text-align:center;font-size:15px;font-weight:700;line-height:1.3}
.tip .ico{width:48px;height:48px;border-radius:50%;background:var(--menta-media);display:flex;align-items:center;justify-content:center;color:var(--bosque)}
</style>
</helmet>
<div style="width:700px;height:700px;padding:0 24px 24px;background:var(--menta);overflow:hidden">

<div style="height:64px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:10px">
<dc-import name="Cactus" mood="relajado" size="34" hint-size="34px,39px"></dc-import>
<span style="font-size:20px;font-weight:900">EffectiveStudy</span>
</div>
<span class="lbl" style="padding:6px 14px;background:var(--crema);border-radius:999px">Pomodoro 25/5</span>
</div>

<section class="zona" style="padding:20px 24px 22px" aria-label="Cuenta regresiva del descanso">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800"><span style="width:10px;height:10px;border-radius:50%;background:var(--rosa)"></span>Descanso</span>
<span class="lbl" style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:2px dashed var(--borde-campo);border-radius:999px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>Campana suave al terminar</span>
</div>
<div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:20px">
<dc-import name="Cactus" mood="relajado" size="160" hint-size="160px,182px"></dc-import>
<div class="mono" role="timer" aria-label="4 minutos 12 segundos" style="font-size:128px;font-weight:800;line-height:1;letter-spacing:-.02em">04:12</div>
</div>
<div style="margin-top:14px;height:12px;border-radius:6px;background:var(--menta-media);overflow:hidden"><div style="width:16%;height:100%;border-radius:6px;background:var(--cactus)"></div></div>
<div style="margin-top:16px;display:flex;align-items:center;gap:12px">
<button class="btn btn-p" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>Pausar</button>
<a class="btn btn-s" href="02-sesion.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7zM18 5v14"/></svg>Saltar descanso</a>
<span style="flex:1"></span>
<a class="btn btn-g btn-sm" href="Main.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Cambiar tiempo</a>
</div>
</section>

<section class="zona" style="margin-top:16px;padding:20px 24px 24px" aria-label="Ideas para descansar">
<h2 style="font-size:19px;font-weight:900">Mientras descansas</h2>
<div style="margin-top:12px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px">
<div class="tip"><span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c3 4 6 7 6 10.5a6 6 0 0 1-12 0C6 10.500 9 7.500 12 3.500z"/></svg></span>Toma un vaso de agua</div>
<div class="tip"><span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M12 8v6M5 10l7 1 7-1M9 21l3-7 3 7"/></svg></span>Estira cuello y espalda</div>
<div class="tip"><span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>Mira algo lejano 20 segundos</div>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":700,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
